<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillBridge – Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/chat.css"/>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <!-- Top Nav -->
  <header class="topnav">
    <div class="topnav__brand">
      <span class="brand-dot"></span>
      <span class="brand-name">SkillBridge</span>
    </div>
    <nav class="topnav__links">
      <a href="index.html">Dashboard</a>
      <a href="chat.html" class="active">Messages</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="assessments.html">Assessments</a>
    </nav>
    <div class="topnav__user">
      <div class="avatar" id="navAvatar">S</div>
    </div>
  </header>

  <div class="chat-layout">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar__header">
        <h2>Messages</h2>
        <input class="sidebar__search" type="text" placeholder="Search conversations…" id="searchInput"/>
      </div>
      <div class="conversation-list" id="conversationList">
        <!-- Populated by JS -->
        <div class="conv-skeleton"></div>
        <div class="conv-skeleton"></div>
        <div class="conv-skeleton"></div>
      </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="chat-main" id="chatMain">
      <div class="chat-empty" id="chatEmpty">
        <div class="chat-empty__icon">💬</div>
        <p>Select a conversation to start chatting</p>
      </div>

      <div class="chat-window" id="chatWindow" style="display:none">
        <div class="chat-header" id="chatHeader">
          <div class="chat-header__info">
            <div class="avatar" id="chatAvatar">?</div>
            <div>
              <div class="chat-header__name" id="chatName">–</div>
              <div class="chat-header__role" id="chatRole">–</div>
            </div>
          </div>
          <span class="chat-header__status online">● Online</span>
        </div>

        <div class="messages-area" id="messagesArea">
          <!-- Messages rendered here -->
        </div>

        <div class="message-input-bar">
          <textarea class="message-input" id="messageInput" placeholder="Type a message…" rows="1"></textarea>
          <button class="send-btn" id="sendBtn" title="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </main>

    <!-- RIGHT PANEL: Milestone & Escrow -->
    <aside class="info-panel" id="infoPanel">
      <div class="info-panel__section">
        <h3 class="info-panel__title">Milestone Status</h3>
        <div class="milestone-card" id="milestoneCard">
          <div class="milestone-label" id="milestoneName">–</div>
          <div class="milestone-badge" id="milestoneStatus">–</div>
          <div class="milestone-due">Due: <span id="milestoneDue">–</span></div>
        </div>
      </div>
      <div class="info-panel__section">
        <h3 class="info-panel__title">Escrow</h3>
        <div class="escrow-box">
          <div class="escrow-amount" id="escrowAmount">₹ –</div>
          <div class="escrow-note">Held securely until milestone approval</div>
        </div>
      </div>
      <div class="info-panel__section">
        <h3 class="info-panel__title">Quick Actions</h3>
        <a href="submit.html" class="panel-btn panel-btn--primary">Submit Work</a>
        <a href="review.html" class="panel-btn panel-btn--outline">Review Submission</a>
      </div>
    </aside>
  </div>

  <script src="js/chat.js"></script>
</body>
</html>
