<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillBridge – Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/portfolio.css"/>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <header class="topnav">
    <div class="topnav__brand"><span class="brand-dot"></span><span class="brand-name">SkillBridge</span></div>
    <nav class="topnav__links">
      <a href="index.html">Dashboard</a>
      <a href="chat.html">Messages</a>
      <a href="portfolio.html" class="active">Portfolio</a>
      <a href="assessments.html">Assessments</a>
    </nav>
    <div class="topnav__user"><div class="avatar" id="navAvatar">S</div></div>
  </header>

  <div class="page-wrapper">
    <div class="page-header">
      <h1 class="page-title">My Portfolio</h1>
      <p class="page-subtitle">Your projects, internships, and achievements</p>
    </div>

    <!-- Projects -->
    <section>
      <h2 class="section-title">Projects</h2>
      <div class="projects-grid" id="projectsGrid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </section>

    <!-- Internships -->
    <section style="margin-top:2.5rem">
      <h2 class="section-title">Internships</h2>
      <div class="internship-list" id="internshipList"></div>
    </section>

    <!-- Shareable Profile Card -->
    <section style="margin-top:2.5rem">
      <h2 class="section-title">Your Profile Card</h2>
      <div class="profile-card" id="profileCard">
        <div class="profile-card__left">
          <div class="profile-avatar" id="profileAvatar">S</div>
          <div>
            <div class="profile-name" id="profileName">Loading…</div>
            <div class="profile-role" id="profileRole">Student</div>
            <div class="profile-skills" id="profileSkills"></div>
          </div>
        </div>
        <div class="profile-card__stats">
          <div class="profile-stat">
            <div class="profile-stat__value" id="statProjects">–</div>
            <div class="profile-stat__label">Projects</div>
          </div>
          <div class="profile-stat">
            <div class="profile-stat__value" id="statScore">–</div>
            <div class="profile-stat__label">Avg Score</div>
          </div>
          <div class="profile-stat">
            <div class="profile-stat__value" id="statEarned">–</div>
            <div class="profile-stat__label">Earned</div>
          </div>
        </div>
        <button class="share-btn" id="shareBtn">🔗 Share Profile</button>
      </div>
    </section>
  </div>

  <!-- Share toast -->
  <div class="toast" id="toast">🔗 Profile link copied to clipboard!</div>

  <script src="js/portfolio.js"></script>
</body>
</html>
