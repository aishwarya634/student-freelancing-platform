<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outcome Verification Tracker - SkillBridge</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .countdown-banner { background: var(--soft-red); border: 0.5px solid #ef4444; color: #b91c1c; padding: 12px; border-radius: 6px; font-weight: bold; margin-bottom: 20px; text-align: center; }
    .checklist-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 0.5px solid var(--border-color); }
    .checklist-item input { transform: scale(1.2); cursor: pointer; }
    .progress-track { background: #e2e8f0; height: 16px; border-radius: 8px; overflow: hidden; margin-bottom: 20px; position: relative; }
    .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s ease; }
    .progress-text { position: absolute; right: 10px; top: -2px; font-size: 0.75rem; font-weight: bold; color: var(--dark-bg); }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="dashboard.html" class="logo">SkillBridge</a>
    <div class="nav-buttons"><a href="dashboard.html" class="btn-login">Workspace Dashboard</a></div>
  </nav>

  <header style="background: var(--soft-green); padding:35px 20px; text-align:center; border-bottom:0.5px solid var(--border-color);">
    <h1 style="color: var(--dark-bg); font-size:1.8rem;">Milestone Execution Sandbox</h1>
  </header>

  <main class="container" style="max-width: 750px; margin-top: 30px;">
    
    <!-- Real-time countdown threshold UI block state container -->
    <div id="countdownAlert" class="countdown-banner" style="display:none;"></div>

    <div class="sb-card" style="margin-bottom: 24px;">
      <h3 id="trackerProjectTitle" style="color: var(--dark-bg); margin-bottom:15px;">Tracking Matrix Loader...</h3>
      
      <label style="font-weight: bold; font-size: 0.9rem; color:#555;">Verified Aggregated Completion Engine</label>
      <div class="progress-track" style="margin-top:6px;">
        <div class="progress-fill" id="statusBarFill"></div>
        <span class="progress-text" id="statusBarText">0% Checked</span>
      </div>

      <div id="checklistWrapper" style="margin-top: 10px; margin-bottom: 20px;">
        <!-- Filled programmatically -->
      </div>

      <button id="btnOpenSubmission" class="btn-primary" style="width: 100%; padding: 12px; border-radius:6px; font-weight: bold;">
        Open Milestone Submission Form
      </button>
    </div>

    <!-- Hidden Submission Form Injection Target Drawer -->
    <div class="sb-card" id="submissionBox" style="display: none; border-top: 4px solid var(--primary);">
      <h4 style="color: var(--dark-bg); margin-bottom:12px;">Finalize Build Package Build Spec</h4>
      <form id="milestoneSubmitForm">
        <div style="margin-bottom:16px;">
          <label style="display:block; font-size:0.85rem; font-weight:bold; margin-bottom:6px;">Public Access Deployment Link</label>
          <input type="url" id="deployUrl" required placeholder="https://yourwork.github.io/artifact" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
        </div>
        <div style="margin-bottom:20px;">
          <label style="display:block; font-size:0.85rem; font-weight:bold; margin-bottom:6px;">Documentation Summary Notes</label>
          <textarea id="submissionNotes" required rows="4" placeholder="Log design execution metrics here for validation loops..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc; font-family:inherit;"></textarea>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn-primary" style="padding:10px 20px; border-radius:6px;">Transmit Package</button>
          <button type="button" onclick="document.getElementById('submissionBox').style.display='none'" style="background:#ef4444; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer;">Cancel</button>
        </div>
      </form>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/outcomes.js"></script>
</body>
</html>
