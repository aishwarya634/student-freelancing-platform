<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SkillBridge</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">SkillBridge</a>
    <div class="nav-buttons">
      <a href="register.html" class="btn-primary">Sign Up</a>
    </div>
  </nav>

  <div class="container" style="max-width: 450px; margin-top: 80px;">
    <div class="sb-card">
      <h2 style="color: var(--dark-bg); margin-bottom: 8px;">Welcome Back</h2>
      <p style="color: #666; margin-bottom: 24px; font-size: 0.95rem;">Log in to access your dashboard and contracts.</p>
      
      <form id="loginForm">
        <div style="margin-bottom: 16px;">
          <label style="display:block; margin-bottom:6px; font-size:0.85rem; font-weight:600;">Email Address</label>
          <input type="email" id="email" required style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc; font-size:1rem;">
        </div>
        <div style="margin-bottom: 24px;">
          <label style="display:block; margin-bottom:6px; font-size:0.85rem; font-weight:600;">Password</label>
          <input type="password" id="password" required style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc; font-size:1rem;">
        </div>
        <button type="submit" class="btn-primary" style="width:100%; padding:12px; border-radius:6px; font-size:1rem; font-weight:600;">Sign In</button>
      </form>
      
      <p style="margin-top: 20px; text-align: center; font-size: 0.9rem; color: #555;">
        New to SkillBridge? <a href="register.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create an account</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
